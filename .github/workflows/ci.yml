# CI pipeline for agent-story
#
# High Assurance Software Engineering (HASEng) goals addressed here:
#   1. Automated regression tests on every push/PR (Python + Node smoke).
#   2. Coverage gate — prevents untested code silently entering main.
#   3. Dependency integrity check — detects supply-chain tampering via
#      `npm ci` (uses package-lock.json checksums) and pip hash-checking.
#   4. Pinned action versions (SHA refs) to prevent hijacked action tags.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read          # least-privilege: read-only checkout

jobs:
  # ── Python: unit tests + coverage ─────────────────────────────────
  python-tests:
    name: Python tests & coverage
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install coverage (pinned, hash-verified)
        # coverage is the only external Python dep needed for CI.
        # Hash-pinning prevents a compromised PyPI release being silently used.
        run: |
          pip install --require-hashes -r requirements-ci.txt

      - name: Run tests with coverage
        run: |
          python -m coverage run --branch --source=list_agents test_list_agents.py
          python -m coverage report --fail-under=80
          python -m coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  # ── Node.js: install integrity + smoke test ────────────────────────
  node-tests:
    name: Node.js smoke test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["18", "20", "22"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies (integrity-verified)
        # `npm ci` verifies every package checksum in package-lock.json,
        # providing supply-chain tamper detection for the Node dependency tree.
        run: npm ci

      - name: Smoke test – CLI status command
        run: npm test
